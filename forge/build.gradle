plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "baublemounts.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    modImplementation "curse.maven:shadow-config-1421861:7572265"

    modImplementation "top.theillusivec4.curios:curios-forge:5.4.2+1.20.1:api"
    modImplementation "top.theillusivec4.curios:curios-forge:5.4.2+1.20.1"

    modImplementation "curse.maven:crafttweaker-239197:6256146"
    //modImplementation "curse.maven:jei-238222:6075247"

    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-forge:12.0.684"
    modRuntimeOnly "me.shedaniel.cloth:basic-math:0.6.1"
    modRuntimeOnly "curse.maven:roughly-enough-items-hacks-521393:4837449"
    modRuntimeOnly "me.shedaniel.cloth:cloth-config-forge:11.1.106"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
